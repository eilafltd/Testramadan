<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUA Alliance | Ramadan Mubarak</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body{
margin:0;
overflow:hidden;
font-family:'Poppins','Cairo',sans-serif;
background:#020617;
color:white;
}
.canvas-container{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
touch-action:none;
}
.ui-layer{
position:relative;
z-index:10;
pointer-events:none;
}
.interactive{
pointer-events:auto;
}
.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div id="webgl-canvas" class="canvas-container"></div>

<div class="ui-layer min-h-screen flex flex-col justify-center items-center text-center px-4">

<h1 class="text-5xl md:text-7xl font-black mb-6 text-yellow-400">
Ramadan Kareem
</h1>

<p class="mb-20 opacity-70">
Click the Mystery Box
</p>

</div>

<script>

let scene,camera,renderer,boxGroup,lid;
let isBoxOpen=false;

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

function init(){

scene=new THREE.Scene();

camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z=5;

renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

document.getElementById("webgl-canvas").appendChild(renderer.domElement);

renderer.domElement.style.touchAction="none";

scene.add(new THREE.AmbientLight(0xffffff,0.8));
const light=new THREE.PointLight(0xffd700,2,20);
light.position.set(5,5,5);
scene.add(light);

boxGroup=new THREE.Group();
scene.add(boxGroup);

const baseGeo=new THREE.BoxGeometry(2,1.8,2);
const baseMat=new THREE.MeshStandardMaterial({
color:0x1e293b,
metalness:0.8,
roughness:0.2
});
const base=new THREE.Mesh(baseGeo,baseMat);
boxGroup.add(base);

const lidGeo=new THREE.BoxGeometry(2.3,0.5,2.3);
const lidMat=new THREE.MeshStandardMaterial({
color:0xeab308,
metalness:0.9,
roughness:0.1
});
lid=new THREE.Mesh(lidGeo,lidMat);
lid.position.y=1.1;
boxGroup.add(lid);

boxGroup.position.y=-1;

animate();
}

function animate(){
requestAnimationFrame(animate);
boxGroup.rotation.y+=0.005;
renderer.render(scene,camera);
}

function handleInteraction(clientX,clientY){

mouse.x=(clientX/window.innerWidth)*2-1;
mouse.y=-(clientY/window.innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);

const intersects=raycaster.intersectObjects(boxGroup.children);

if(intersects.length>0){
openBox();
}

}

function setupPointer(){
renderer.domElement.addEventListener("pointerdown",(e)=>{
handleInteraction(e.clientX,e.clientY);
});
}

function openBox(){

if(isBoxOpen)return;
isBoxOpen=true;

gsap.to(lid.position,{
y:3.5,
duration:0.8,
ease:"back.out(1.7)"
});

gsap.to(lid.rotation,{
x:1.2,
z:0.8,
duration:1
});

setTimeout(()=>{
gsap.to(lid.position,{y:1.1,duration:1,ease:"bounce.out"});
gsap.to(lid.rotation,{x:0,z:0,duration:1});
isBoxOpen=false;
},2500);

}

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

init();
setupPointer();

</script>

</body>
</html>
